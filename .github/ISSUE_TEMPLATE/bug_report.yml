name: Bug report
description: Report a problem with FocusTube
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to report a bug. Before submitting, please search
        existing issues to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Version and install method
      description: Version shown in the package, and how you installed it (`.deb` or built from source).
      placeholder: e.g. 2.0.0, installed from the .deb
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Desktop environment
      description: Distribution and desktop environment.
      placeholder: e.g. Ubuntu 24.04, GNOME
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, concrete steps.
      placeholder: |
        1. Open FocusTube
        2. Open a video from ...
        3. Click the description
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: Run `focustube` (or `npm start`) from a terminal and paste relevant output.
      render: shell