name: Build Debian Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package Linux .deb
        run: npx electron-builder --linux deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focustube-linux-deb
          path: |
            dist/*.deb
          if-no-files-found: error

      - name: Draft release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt-tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: focustube-linux-deb
          path: dist

      - name: Import release signing key
        env:
          FOCUSTUBE_REPO_SIGNING_KEY: ${{ secrets.FOCUSTUBE_REPO_SIGNING_KEY }}
        run: echo "$FOCUSTUBE_REPO_SIGNING_KEY" | gpg --batch --import

      - name: Build and sign APT repository
        run: bash scripts/apt-repo.sh
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FOCUSTUBE_REPO_SIGNING_PASSPHRASE }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4