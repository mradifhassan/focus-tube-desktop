name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: focustube-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Linux: .deb + .rpm
  # --------------------------------------------------------------------------
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package Linux .deb + .rpm
        run: npx electron-builder --linux deb rpm --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Arch Linux: .pkg.tar.zst + pacman repo (repackaged from the .deb)
  # --------------------------------------------------------------------------
  arch:
    name: Arch package
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs

      - name: Build Arch package + pacman repo
        run: |
          docker run --rm -v "$PWD:/w" -w /w archlinux:base-devel \
            bash scripts/arch-repo.sh pkgs/focus-tube-desktop_*_amd64.deb pages/arch

      - name: Upload Arch repo
        uses: actions/upload-artifact@v4
        with:
          name: arch-repo
          path: pages/arch
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows: native .exe installer (NSIS)
  # --------------------------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package Windows installer (.exe)
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: focustube-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS: native .dmg (unsigned — Gatekeeper prompt on first open)
  # --------------------------------------------------------------------------
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package macOS apps (.dmg, x64 + arm64)
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS apps
        uses: actions/upload-artifact@v4
        with:
          name: focustube-macos
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Android: signed APK (Capacitor)
  # --------------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Set Android version
        env:
          REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          VER="${REF#v}"
          if [ -z "$VER" ]; then
            VER="$(node -p 'require("./package.json").version')"
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3); [ -n "$PATCH" ] || PATCH=0
          echo "ANDROID_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Restore release signing keystore
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/focustube-release.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pkeystore=../focustube-release.keystore \
            -PkeystorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}

      - name: Package APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FocusTube-${ANDROID_VERSION_NAME}.apk"
          ls -lh dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: focustube-android
          path: dist/FocusTube-*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Repositories on GitHub Pages (apt + dnf + pacman) — every push
  # --------------------------------------------------------------------------
  repos:
    name: Publish apt/rpm/arch repos
    needs: [linux, arch]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install repo tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Import release signing key
        env:
          FOCUSTUBE_REPO_SIGNING_KEY: ${{ secrets.FOCUSTUBE_REPO_SIGNING_KEY }}
        run: echo "$FOCUSTUBE_REPO_SIGNING_KEY" | gpg --batch --import

      - name: Build apt repository
        run: OUT_DIR=pages bash scripts/apt-repo.sh
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FOCUSTUBE_REPO_SIGNING_PASSPHRASE }}

      - name: Build rpm repository
        run: bash scripts/rpm-repo.sh pages/rpm

      - name: Add Arch repository
        uses: actions/download-artifact@v4
        with:
          name: arch-repo
          path: pages/arch

      - name: Landing page
        run: |
          cat > pages/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>FocusTube packages</title>
          <h1>FocusTube package repositories</h1>
          <ul>
            <li><b>Debian/Ubuntu (apt):</b> <code>deb [signed-by=...] https://mradifhassan.github.io/focus-tube-desktop stable main</code> (<a href="focustube.asc">key</a>)</li>
            <li><b>Fedora/RHEL (dnf):</b> <a href="rpm/focustube.repo">focustube.repo</a></li>
            <li><b>Arch (pacman):</b> <a href="arch/">/arch</a></li>
          </ul>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - uses: actions/deploy-pages@v4
        id: deployment

  # --------------------------------------------------------------------------
  # Releases: rolling "latest" pre-release on main, versioned release on tags
  # --------------------------------------------------------------------------
  release:
    name: Release
    needs: [linux, arch, windows, macos, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Clear rolling release assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while IFS= read -r n; do
                [ -n "$n" ] && gh release delete-asset latest "$n" --repo "$GITHUB_REPOSITORY" -y
              done
          fi

      - name: Rolling "latest" release (branch push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.exe
            dist/*.dmg
            dist/*.apk
            dist/*.yml

      - name: Versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.exe
            dist/*.dmg
            dist/*.apk
            dist/*.yml
