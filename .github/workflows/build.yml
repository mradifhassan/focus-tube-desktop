name: Build Debian Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: focustube-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mradifhassan.github.io/focus-tube-desktop/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package Linux .deb
        run: npx electron-builder --linux deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focustube-linux-deb
          path: |
            dist/*.deb
          if-no-files-found: error

      - name: Draft release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- APT repository on GitHub Pages (published on every release tag) ----

      - name: Install apt-tools (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Import release signing key (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FOCUSTUBE_REPO_SIGNING_KEY: ${{ secrets.FOCUSTUBE_REPO_SIGNING_KEY }}
        run: echo "$FOCUSTUBE_REPO_SIGNING_KEY" | gpg --batch --import

      - name: Build and sign APT repository (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/apt-repo.sh
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FOCUSTUBE_REPO_SIGNING_PASSPHRASE }}

      - name: Configure Pages (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@v4