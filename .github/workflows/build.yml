name: Build Debian Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: focustube-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # --------------------------------------------------------------------------
  # Linux: .deb + APT repository + GitHub Pages
  # --------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mradifhassan.github.io/focus-tube-desktop/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package Linux .deb
        run: npx electron-builder --linux deb --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focustube-linux-deb
          path: |
            dist/*.deb
          if-no-files-found: error

      # ---- APT repository on GitHub Pages (published on every release tag) ----

      - name: Install apt-tools (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Import release signing key (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FOCUSTUBE_REPO_SIGNING_KEY: ${{ secrets.FOCUSTUBE_REPO_SIGNING_KEY }}
        run: echo "$FOCUSTUBE_REPO_SIGNING_KEY" | gpg --batch --import

      - name: Build and sign APT repository (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/apt-repo.sh
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FOCUSTUBE_REPO_SIGNING_PASSPHRASE }}

      - name: Configure Pages (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@v4

  # --------------------------------------------------------------------------
  # Windows: native .exe installer (NSIS)
  # --------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package Windows installer (.exe)
        run: npx electron-builder --win nsis --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focustube-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS: native .dmg (unsigned — Gatekeeper prompt on first open)
  # --------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Package macOS apps (.dmg, x64 + arm64)
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focustube-macos
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Android: signed APK (Capacitor) — built on tags / manual dispatch
  # --------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Build renderer (web app -> app/)
        run: npm run build:renderer

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Set Android version from tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          VER="${REF#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          [ -n "$PATCH" ] || PATCH=0
          echo "ANDROID_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Restore release signing keystore
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/focustube-release.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pkeystore=../focustube-release.keystore \
            -PkeystorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}

      - name: Package APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FocusTube-${ANDROID_VERSION_NAME}.apk"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focustube-android
          path: dist/FocusTube-*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Release: combine all platform artifacts into one GitHub Release (tags only)
  # --------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.apk
            dist/latest.yml
            dist/latest-mac.yml
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}